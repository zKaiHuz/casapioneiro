<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inauguração Casa Pioneiro | Grupo de Ofertas no WhatsApp</title>
<meta name="description" content="Entre no grupo do WhatsApp da Casa Pioneiro e receba as ofertas da inauguração de forma antecipada.">

<style>
  :root{
    --red:#d80f1f;
    --red-dark:#8f0812;
    --yellow:#ffc81a;
    --green:#1faa3f;
    --green-dark:#0d7a2a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;
    background:linear-gradient(160deg,var(--red) 0%,var(--red-dark) 100%);
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .wrap{width:100%;max-width:460px;display:flex;flex-direction:column}

  /* Topo: fachada (coloque fachada.jpg na mesma pasta) */
  .hero{
    height:230px;
    background:
      linear-gradient(to bottom,rgba(0,0,0,0) 55%,var(--red-dark) 100%),
      url("fachada.jpg") center/cover no-repeat,
      linear-gradient(135deg,#6b6b70,#3a3a3f);
    display:flex;align-items:flex-start;justify-content:center;
    padding-top:22px;
  }
  .brand{
    background:rgba(255,255,255,.95);
    color:#222;
    padding:8px 18px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 6px 18px rgba(0,0,0,.25);
  }
  .brand b{font-size:26px;font-style:italic;letter-spacing:.3px}
  .brand b span{color:var(--red)}
  .brand small{display:block;font-size:10px;letter-spacing:1.5px;color:#555;margin-top:2px}

  .content{padding:0 22px 34px;text-align:center;margin-top:-14px}

  .title{
    background:linear-gradient(180deg,#ffd84a,var(--yellow));
    color:#fff;
    border-radius:18px;
    padding:14px 10px;
    font-size:clamp(30px,9vw,42px);
    font-weight:900;
    letter-spacing:.5px;
    text-shadow:0 3px 0 var(--red),0 5px 8px rgba(0,0,0,.35);
    box-shadow:0 8px 0 #c99500,0 12px 24px rgba(0,0,0,.35);
    transform:rotate(-2deg);
  }

  .sub{margin-top:28px;font-weight:800;font-size:15px;letter-spacing:.8px}

  .group{
    margin:10px auto 0;
    background:linear-gradient(180deg,var(--green),var(--green-dark));
    border-radius:18px;
    padding:12px 14px;
    font-size:clamp(26px,8vw,36px);
    font-weight:900;
    line-height:1.05;
    text-shadow:0 3px 6px rgba(0,0,0,.35);
    box-shadow:0 8px 20px rgba(0,0,0,.3);
  }

  .offer-lead{margin-top:22px;font-weight:800;font-size:14px;letter-spacing:.6px}
  .offer{
    margin:8px auto 0;
    background:var(--yellow);
    color:#5a0a10;
    border-radius:14px;
    padding:10px 14px;
    font-size:clamp(22px,7vw,30px);
    font-weight:900;
    line-height:1.05;
    box-shadow:0 6px 16px rgba(0,0,0,.3);
  }
  .early{
    display:inline-block;
    margin-top:12px;
    background:#ff2a2a;
    padding:6px 16px;
    font-style:italic;
    font-weight:900;
    font-size:16px;
    transform:skew(-8deg);
    box-shadow:0 4px 10px rgba(0,0,0,.3);
  }

  .cta{
    margin-top:30px;
    display:flex;align-items:center;justify-content:center;gap:12px;
    background:linear-gradient(180deg,#2fd056,var(--green));
    color:#fff;
    text-decoration:none;
    font-weight:900;
    font-size:20px;
    letter-spacing:.5px;
    padding:18px 20px;
    border-radius:60px;
    border:3px solid rgba(255,255,255,.55);
    box-shadow:0 8px 0 var(--green-dark),0 14px 26px rgba(0,0,0,.4);
    animation:pulse 1.8s infinite;
    transition:transform .1s;
  }
  .cta:active{transform:translateY(4px);box-shadow:0 4px 0 var(--green-dark)}
  .cta svg{width:34px;height:34px;flex:none}
  @keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.04)}
  }

  .note{margin-top:18px;font-size:12px;opacity:.85}
  .slogan{margin-top:22px;font-style:italic;font-size:14px;opacity:.9}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="brand">
      <b>Casa <span>Pioneiro</span></b>
      <small>UTILIDADES • EMBALAGENS • PRESENTES</small>
    </div>
  </div>

  <main class="content">
    <div class="title">INAUGURAÇÃO</div>

    <p class="sub">ENTRE NO NOSSO</p>
    <div class="group">GRUPO DO<br>WHATSAPP</div>

    <p class="offer-lead">E TENHA ACESSO ÀS</p>
    <div class="offer">OFERTAS DA<br>INAUGURAÇÃO</div>
    <div class="early">DE FORMA ANTECIPADA!</div>

    <a id="btn" class="cta" href="https://chat.whatsapp.com/JYJ3sf0c37sBnVMGnskiu9?s=cl&p=i&mlu=4&ilr=4">
      <svg viewBox="0 0 32 32" fill="#fff" aria-hidden="true"><path d="M16 3C9 3 3.3 8.6 3.3 15.5c0 2.4.7 4.7 1.9 6.6L3 29l7.100-2.100c1.800 1 3.800 1.500 5.900 1.500 7 0 12.700-5.600 12.700-12.500S23 3 16 3zm0 22.700c-1.900 0-3.700-.5-5.300-1.500l-.4-.2-4.200 1.200 1.300-4-.3-.4a10 10 0 0 1-1.600-5.300C5.500 9.900 10.200 5.300 16 5.300s10.500 4.600 10.500 10.200S21.800 25.700 16 25.700zm5.800-7.600c-.3-.2-1.900-.9-2.200-1s-.5-.2-.7.200-.8 1-1 1.200-.4.200-.7.100a8.500 8.500 0 0 1-4.200-3.700c-.3-.6.300-.5.900-1.700.1-.2 0-.4 0-.5l-1-2.300c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.5.100-.8.400s-1 1-1 2.400 1.100 2.800 1.200 3c.2.200 2.100 3.300 5.200 4.500 1.900.8 2.700.9 3.600.7.600-.1 1.900-.8 2.200-1.500s.3-1.400.2-1.500-.3-.2-.6-.4z"/></svg>
      ENTRAR NO GRUPO
    </a>

    <p class="note">Toque no botão e você será direcionado ao WhatsApp.</p>
    <p class="slogan">Sua casa. Seu jeito.</p>
  </main>
</div>

<script>
  // Dispara evento de Lead no Pixel (se ativado) e segue para o grupo
  document.getElementById('btn').addEventListener('click', function(e){
    if (window.fbq) {
      e.preventDefault();
      var url = this.href;
      fbq('track','Lead');
      setTimeout(function(){ window.location.href = url; }, 350);
    }
  });
</script>
</body>
</html>
